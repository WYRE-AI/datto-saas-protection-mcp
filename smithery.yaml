# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - dattoSaasPublicKey
      - dattoSaasSecretKey
    properties:
      dattoSaasPublicKey:
        type: string
        description: Datto REST API public key (Partner Portal > Admin > Integrations > API Keys)
      dattoSaasSecretKey:
        type: string
        description: Datto REST API secret key
  commandFunction: |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { DATTO_SAAS_PUBLIC_KEY: config.dattoSaasPublicKey, DATTO_SAAS_SECRET_KEY: config.dattoSaasSecretKey, MCP_TRANSPORT: 'stdio' } })
