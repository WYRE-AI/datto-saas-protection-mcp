services:
  # Gateway mode. The public and secret keys arrive per request on
  # X-Datto-SaaS-Public-Key and X-Datto-SaaS-Secret-Key. Do not set
  # DATTO_SAAS_PUBLIC_KEY, DATTO_SAAS_SECRET_KEY, or env_file here — that
  # would put static vendor credentials in the container. Compose interpolates
  # CONDUIT_S2S_SECRET from the project .env. For AUTH_MODE=env, pass
  # DATTO_SAAS_PUBLIC_KEY and DATTO_SAAS_SECRET_KEY on that process instead
  # (see the README).
  datto-saas-protection-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
